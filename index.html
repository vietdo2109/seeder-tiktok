<!DOCTYPE html>
<html>
<head>
  <title>Chrome Seeder UI</title>
  <style>
    body { font-family: 'Consolas', 'Monaco', monospace; padding: 20px; margin: 0; }
    #log { background: #1a1a1a; padding: 12px; height: 420px; overflow-y: auto; border-radius: 6px; font-size: 13px; line-height: 1.5; }
    .log-line { padding: 2px 0; word-break: break-word; }
    .log-info { color: #b0b0b0; }
    .log-success { color: #4ade80; }
    .log-warn { color: #fbbf24; }
    .log-error { color: #f87171; background: rgba(248,113,113,0.1); padding: 4px 6px; margin: 2px 0; border-left: 3px solid #f87171; }
    .log-stop { color: #a78bfa; font-weight: 600; }
    .log-bat { color: #60a5fa; }
    button { padding: 10px 20px; font-size: 14px; cursor: pointer; border-radius: 4px; border: none; }
    .btn-group { margin: 8px 0; }
    .btn-group button { margin-right: 8px; }
    #launchBtn { background: #4ade80; color: #000; }
    #launchBtn:disabled { background: #6b7280; color: #9ca3af; cursor: not-allowed; }
    #editBtn { background: #3b82f6; color: #fff; }
    #clearLogBtn { background: #6b7280; color: #fff; }
    #saveLogBtn { background: #8b5cf6; color: #fff; }
    h3 { margin: 16px 0 8px 0; }
    input { padding: 6px 8px; font-family: inherit; }
  </style>
</head>
<body>
  <h2>Chrome Seeder UI</h2>

  <label>Livestream URL:</label><br />
  <input id="urlInput" type="text" style="width:100%; margin-bottom:8px" value="https://www.tiktok.com/@tiemtraannhien.officical/live"><br />

  <label>Interval (seconds):</label><br />
  <input id="intervalInput" type="number" value="60" style="margin-bottom:12px"><br />

  <div class="btn-group">
    <button id="launchBtn">Launch Chrome + Seeder</button>
    <button id="editBtn">Modify Comments</button>
    <button id="clearLogBtn">Clear Logs</button>
    <button id="saveLogBtn">Save Logs</button>
  </div>

  <h3>Status: <span id="status" style="color:gray">Idle</span></h3>

  <h3>Logs:</h3>
  <div id="log"></div>

  <script src="renderer.js"></script>
</body>
</html>
